name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vezzi
          POSTGRES_PASSWORD: vezzi
          POSTGRES_DB: vezzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vezzi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vezzi:vezzi@localhost:5432/vezzi_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: OpenAPI в docs/ актуален
        run: |
          uv run vezzi export-openapi /tmp/openapi.json
          diff -q docs/openapi.json /tmp/openapi.json || (echo "Запустите make openapi и закоммитьте docs/openapi.json" && exit 1)

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
