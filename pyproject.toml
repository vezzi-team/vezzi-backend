[project]
name = "vezzi-backend"
version = "0.2.0"
description = "Backend приложения «Умная корзина» (Vezzi): сравнение стоимости корзины и пеший маршрут по магазинам"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "email-validator>=2.2",
    "fastapi>=0.162",
    "httpx2>=2.16.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3",
    "pwdlib[argon2]>=0.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
vezzi = "app.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=6.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # порядок импортов
    "B",             # частые ошибки
    "UP",            # современный синтаксис
    "SIM",           # упрощения
    "RUF",           # правила самого ruff
    "N",             # именование
    "S",             # безопасность (bandit)
    "DTZ",           # datetime без часового пояса
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях допустима
    "B008",                        # Depends(...) в аргументах: стандартный стиль FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E402"]  # E402: в conftest окружение задаётся до импорта приложения
"alembic/versions/**" = ["E501"]
"app/demo/catalog.py" = ["E501"]  # таблицы демо-данных читаются лучше в одну строку

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # иначе папка alembic/ в корне считается нашим модулем

[tool.mypy]
python_version = "3.12"
packages = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
